<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: linear-gradient(to bottom, #87CEEB 60%, #90EE90 100%);
  height: 100vh;
  overflow: hidden;
}

.scene {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

/* Дорога */
.road {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 60px;
  background: #333;
}

/* Машинка */
.car {
  position: absolute;
  bottom: 35px;
  left: -200px;
  width: 200px;
  animation: drive 3s ease-in-out forwards;
}

.car-body {
  height: 40px;
  background: #ff4136;
  border-radius: 15px 15px 0 0;
  position: relative;
}

.car-top {
  height: 30px;
  background: #ff4136;
  border-radius: 10px 10px 0 0;
  position: absolute;
  top: -20px;
  left: 20px;
  right: 20px;
}

.wheel {
  position: absolute;
  bottom: -10px;
  width: 25px;
  height: 25px;
  background: #333;
  border-radius: 50%;
  animation: rotate 1s linear infinite;
}

.wheel.front {
  left: 30px;
}

.wheel.back {
  right: 30px;
}

/* Пейзаж */
.sun {
  position: absolute;
  top: 20px;
  right: 50px;
  width: 40px;
  height: 40px;
  background: #ffdc00;
  border-radius: 50%;
}

.tree {
  position: absolute;
  bottom: 60px;
  right: 200px;
}

.tree-trunk {
  width: 10px;
  height: 40px;
  background: #8B4513;
  margin: 0 auto;
}

.tree-top {
  width: 40px;
  height: 40px;
  background: #228B22;
  border-radius: 50%;
  margin-top: -20px;
}

.house {
  position: absolute;
  bottom: 60px;
  left: 100px;
}

.house-body {
  width: 60px;
  height: 40px;
  background: #f0e0c0;
}

.house-roof {
  width: 0;
  height: 0;
  border-left: 30px solid transparent;
  border-right: 30px solid transparent;
  border-bottom: 20px solid #8B0000;
  margin-top: -20px;
}

/* Анимации */
@keyframes drive {
  to {
    left: calc(100% - 250px);
  }
}

@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}

@keyframes cloudMove {
  to {
    left: calc(100% + 200px);
  }
}
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>

  <div class="house">
    <div class="house-roof"></div>
    <div class="house-body"></div>
  </div>
  
  <div class="tree">
    <div class="tree-top"></div>
    <div class="tree-trunk"></div>
  </div>
  
  <div class="car">
    <div class="car-body">
      <div class="car-top"></div>
    </div>
    <div class="wheel front"></div>
    <div class="wheel back"></div>
  </div>
  
  <div class="road"></div>
</div>
</body>
</html>
